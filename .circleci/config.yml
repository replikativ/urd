version: 2.1

orbs:
  tools: replikativ/clj-tools@0

workflows:
  build-test-and-deploy:
    jobs:
      - tools/setup:
          context: docker-deploy
      - tools/build:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/format:
          context: docker-deploy
          requires:
            - tools/setup
      - test-consensus:
          context: docker-deploy
          requires:
            - tools/setup
      - tools/deploy:
          context:
            - clojars-deploy
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/build
            - test-consensus
      - tools/release:
          context:
            - github-token
            - docker-deploy
          filters:
            branches:
              only: main
          requires:
            - tools/deploy

jobs:
  test-consensus:
    docker:
      - image: cimg/clojure:1.12
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Download dependencies
          command: clojure -P -M:test
      - run:
          name: Run consensus tests
          command: clojure -M:test
